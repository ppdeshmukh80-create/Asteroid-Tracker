<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA/JPL Near-Earth Asteroid Explorer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1>NASA/JPL Near-Earth Asteroid Explorer</h1>
    <p class="subtitle">Explore official NASA/JPL asteroid close-approach data in a simpler way.</p>
  </header>



  <main>
    <section class="disclaimer">
      <p>Close approach does not mean an asteroid is predicted to impact Earth.</p>
    </section>

    <p class="data-coverage-note" id="data-coverage-note"></p>

    <div class="category-selector">
      <button class="category-btn" data-category="all">All Approaches</button>
      <button class="category-btn" data-category="historical">Historical Approaches</button>
      <button class="category-btn" data-category="future">Upcoming Approaches</button>
    </div>

    <section class="filters" id="filters">
      <label for="start-date-input">Start Date</label>
      <input type="date" id="start-date-input">

      <label for="end-date-input">End Date</label>
      <input type="date" id="end-date-input">

      <button id="reset-filters-btn">Reset Filters</button>
    </section>

    <section class="summary-cards" id="summary-cards">
      <!-- summary cards will go here in a later phase -->
    </section>

    <section class="data-table-section" id="data-table-section">
      <!-- asteroid table will go here in a later phase -->
    </section>
  </main>

  <footer class="site-footer">
    <p>Data source: NASA/JPL Small-Body Database Close Approach Data API.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/normalize.js"></script>
  <script src="js/summary.js"></script>
  <script src="js/table.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
